[Service]
# This is instance-specific: the packaged executable remains untouched.
Environment=RELAY_BINARY=/usr/local/libexec/imx471-v4l2-relayd
Environment=IMX471_ISOLATE_INPUT=1
# Many libcamera/Mesa worker threads otherwise leave behind independent arenas.
Environment=MALLOC_ARENA_MAX=2
Environment=MALLOC_TRIM_THRESHOLD_=131072
