# Sony IMX471 backport, reviewed source pinned to the repair recorded here.
PACKAGE_NAME="imx471-backport"
PACKAGE_VERSION="2026.10.08"
BUILT_MODULE_NAME[0]="imx471"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
BUILD_EXCLUSIVE_KERNEL_MIN="7.0"
MAKE[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"

# Prefer an in-tree module (including a built-in driver) when one is shipped.
# DKMS exit 77 is a supported autoinstall skip, not a build failure.
if compgen -G "/lib/modules/${kernelver}/kernel/drivers/media/i2c/imx471.ko*" >/dev/null ||
   grep -qE '(^|/)imx471\.ko$' "/lib/modules/${kernelver}/modules.builtin" 2>/dev/null; then
    BUILD_EXCLUSIVE_KERNEL="^$"
fi
