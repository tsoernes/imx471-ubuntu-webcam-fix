# Only the simple libcamera pipeline is enabled by the service override.
# Do not synthesize frames across on-demand reopen or suspend timestamp gaps.
# skip-to-first avoids padding from the long-lived relay's original base time.
VIDEOSRC="libcamerasrc ! video/x-raw,width=1280,height=720 ! videoconvert ! videorate drop-only=true skip-to-first=true max-rate=30"
FORMAT=YUY2
WIDTH=1280
HEIGHT=720
FRAMERATE=30/1
CARD_LABEL="Built-in Sony IMX471"
