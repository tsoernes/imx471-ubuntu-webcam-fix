name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install syntax checker
        run: sudo apt-get update && sudo apt-get install -y fish
      - name: Compile and statically analyze helper
        run: |
          mkdir build
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -fanalyzer normalize-framerate.c -o build/normalize-framerate
      - name: Check installer syntax
        run: fish -n install.fish
      - name: Check helper usage rejection (no camera access)
        run: |
          rc=0
          build/normalize-framerate || rc=$?
          test "$rc" -eq 2
