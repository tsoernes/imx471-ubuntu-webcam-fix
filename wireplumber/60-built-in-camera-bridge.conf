# IPU7 raw capture nodes are not standalone webcams. Keep the USB webcam and
# the on-demand IMX471 loopback interface; avoid presenting unusable raw nodes.
monitor.v4l2.rules = [
  {
    matches = [ { api.v4l2.cap.driver = "isys" } ]
    actions = { update-props = { device.disabled = true node.disabled = true } }
  }
]
# The built-in sensor is owned on demand by v4l2-relayd. Do not offer a
# competing native PipeWire node for the same sensor.
monitor.libcamera.rules = [
  {
    matches = [ { device.name = "~libcamera_device.*LNK0.*" } ]
    actions = { update-props = { device.disabled = true node.disabled = true } }
  }
]
