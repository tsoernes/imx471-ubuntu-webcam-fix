[Unit]
Wants=imx471-framerate-normalizer.service

[Service]
Environment=LIBCAMERA_PIPELINES_MATCH_LIST=simple
Environment=RELAY_BINARY=/usr/bin/v4l2-relayd
DeviceAllow=char-dma_heap rw
# Bound the output queue explicitly: v4l2-relayd's producer does not honor
# appsrc enough-data, so max-bytes alone is not an enforced memory bound.
# Discard stale frames instead of blocking the camera or accumulating latency.
MemoryAccounting=yes
MemoryHigh=256M
MemoryMax=512M
MemorySwapMax=0
RestartSec=3s
# GStreamer sets 30 fps as 300000/10000. PipeWire 1.6.2's fixed-rate
# negotiation rejects that unreduced fraction; normalize without changing fps.
ExecStartPost=/usr/local/libexec/imx471-normalize-framerate /dev/video50
ExecStart=
ExecStart=/bin/sh -c 'DEVICE=$(grep -l -m1 -E "^${CARD_LABEL}$" /sys/devices/virtual/video4linux/*/name | cut -d/ -f6); exec "${RELAY_BINARY}" -i "${VIDEOSRC}" $${SPLASHSRC:+-s "${SPLASHSRC}"} -o "appsrc name=appsrc is-live=true format=time max-buffers=3 max-bytes=0 max-time=0 leaky-type=downstream caps=video/x-raw,format=${FORMAT},width=${WIDTH},height=${HEIGHT},framerate=${FRAMERATE} ! videoconvert ! v4l2sink name=v4l2sink device=/dev/$${DEVICE} sync=false" $EXTRA_OPTS'
